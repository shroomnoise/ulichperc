name: Build Windows VST3

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-windows-vst3:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake (Visual Studio 2022, x64)
        run: cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 (Release)
        run: cmake --build build-win --config Release --target ulichperc_VST3 --parallel

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ulichnayapercussiya-vst3-windows
          path: build-win/ulichperc_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
          retention-days: 14
